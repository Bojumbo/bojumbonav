version: "3.9"

services:
  trucknav:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trucknav
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
